name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify published CSS includes design tokens
        run: |
          npm run build
          if ! grep -q -- "--cc-primary:" dist/*.css; then
            echo "ERROR: built CSS is missing design token definitions (--cc-primary) — check src/index.ts imports global.css" >&2
            exit 1
          fi

      - name: Build Storybook
        run: npm run build-storybook
